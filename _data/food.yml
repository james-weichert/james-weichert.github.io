- name: Handmade Tagliatelle alla Bolognese
  cuisine: Italian
  img: ./assets/images/food/avif/tagliatelle-bolognese.avif
  alt: A bowl of thick-cut tagliatelle pasta mixed with a light Bolognese ragu.
  type: Recipe
  plate: true
  description: "Pasta with Bolognese ragu has always been a staple in my kitchen, but taking the final step of making my own pasta always seemed too daunting. On a recent trip to Bologna, I overcame my pasta-making fears and learned how to make tagliatelle pasta by hand. With a little guidance and enough patience, it's actually not that hard to make. Combine <strong>one egg for every 100 grams of pasta flour</strong>. Knead until the dough is combined and springy before resting for 30 minutes. Then, carefully roll out the dough until it is as thin as possible and cut into half-inch strips before cooking."